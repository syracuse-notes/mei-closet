<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>メイの着用アイテム</title><meta name="robots" content="noindex"><style>
:root{--bg:#fbf8f6;--fg:#222;--sub:#777;--card:#fff;--line:#eee;--acc:#bf0000}
@media (prefers-color-scheme:dark){:root{--bg:#161414;--fg:#eee;--sub:#aaa;--card:#221f1f;--line:#333;--acc:#ff5a5a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans",sans-serif;line-height:1.6}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:8px 0 4px}.note{font-size:12px;color:var(--sub);margin:0 0 20px}
section{margin:28px 0}h2{font-size:17px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;color:inherit;text-decoration:none}
a.card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#ddd}
.b{padding:8px 10px}.no{font-size:12px;color:var(--acc);font-weight:700}.nm{font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{font-weight:700;margin-top:2px}.go{font-size:12px;color:var(--acc)}
footer{font-size:11px;color:var(--sub);margin-top:36px}
</style></head><body><main>
